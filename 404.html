<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Split</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 48px 20px 64px;
    line-height: 1.55;
    color: #1a1a1a;
    background: #fff;
    text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e8e8e8; background: #14161a; }
    .code { background: #22262e !important; border-color: #2a2e35 !important; }
    .btn-ghost { border-color: #3a3f47 !important; color: #e8e8e8 !important; }
  }
  h1 { font-size: 1.4em; margin-bottom: 0.2em; }
  p.sub { color: #777; margin-top: 0; }
  .code {
    display: inline-block;
    margin: 24px 0 8px;
    padding: 10px 18px;
    border-radius: 10px;
    background: #f3f3f5;
    border: 1px solid #e5e5e8;
    font-size: 1.05em;
    word-break: break-all;
  }
  .btn {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 14px 20px;
    margin: 10px 0;
    border-radius: 12px;
    border: none;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .btn-primary { background: #4c6fff; color: #fff; }
  .btn-ghost { background: transparent; color: #1a1a1a; border: 1px solid #ddd; }
  section.hint { margin-top: 40px; color: #888; font-size: 0.9em; }
  a.home { color: inherit; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  var STR = {
    ru: {
      heading: 'Вас пригласили в группу Split',
      body: 'Откройте ссылку в приложении, чтобы посмотреть приглашение.',
      openButton: 'Открыть в Split',
      noAppHeading: 'Нет приложения?',
      noAppBody: 'Установите Split и вставьте эту ссылку или код группы при входе.',
      codeLabel: 'Код группы',
      copyButton: 'Скопировать код',
      copiedButton: 'Скопировано',
      notFoundHeading: 'Страница не найдена',
      notFoundBody: 'Такой страницы нет.',
      homeLink: 'На главную →'
    },
    en: {
      heading: 'You’ve been invited to a Split group',
      body: 'Open this link in the app to see the invite.',
      openButton: 'Open in Split',
      noAppHeading: 'Don’t have the app?',
      noAppBody: 'Install Split and paste this link or the group code when you sign in.',
      codeLabel: 'Group code',
      copyButton: 'Copy code',
      copiedButton: 'Copied',
      notFoundHeading: 'Page not found',
      notFoundBody: 'There’s nothing here.',
      homeLink: 'Go home →'
    },
    kk: {
      heading: 'Сізді Split тобына шақырды',
      body: 'Шақыруды көру үшін сілтемені қолданбада ашыңыз.',
      openButton: 'Split-те ашу',
      noAppHeading: 'Қолданба жоқ па?',
      noAppBody: 'Split орнатып, кіру кезінде осы сілтемені немесе топ кодын енгізіңіз.',
      codeLabel: 'Топ коды',
      copyButton: 'Кодты көшіру',
      copiedButton: 'Көшірілді',
      notFoundHeading: 'Бет табылмады',
      notFoundBody: 'Мұнда ештеңе жоқ.',
      homeLink: 'Басты бетке →'
    }
  };

  var lang = 'ru';
  var nav = (navigator.language || 'ru').toLowerCase();
  if (nav.indexOf('kk') === 0) lang = 'kk';
  else if (nav.indexOf('en') === 0) lang = 'en';
  var t = STR[lang];
  document.documentElement.lang = lang;

  var m = location.pathname.match(/^\/splitkz-legal\/g\/(.+?)\/?$/i);
  var app = document.getElementById('app');

  function el(tag, attrs, html) {
    var e = document.createElement(tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (html != null) e.innerHTML = html;
    return e;
  }

  if (m) {
    var code = decodeURIComponent(m[1]);
    var scheme = 'splitkz://g/' + encodeURIComponent(code);

    document.title = t.heading;
    var meta = el('meta', { property: 'og:title' });
    meta.content = t.heading;
    document.head.appendChild(meta);
    var metaDesc = el('meta', { property: 'og:description' });
    metaDesc.content = t.body;
    document.head.appendChild(metaDesc);

    app.appendChild(el('h1', {}, t.heading));
    app.appendChild(el('p', { class: 'sub' }, t.body));

    var openBtn = el('a', { class: 'btn btn-primary', href: scheme }, t.openButton);
    app.appendChild(openBtn);

    var codeBox = el('div', { class: 'code' }, code);
    app.appendChild(codeBox);

    var copyBtn = el('button', { class: 'btn btn-ghost' }, t.copyButton);
    copyBtn.addEventListener('click', function () {
      var done = function () {
        copyBtn.textContent = t.copiedButton;
        setTimeout(function () { copyBtn.textContent = t.copyButton; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(done, done);
      } else {
        done();
      }
    });
    app.appendChild(copyBtn);

    var hint = el('section', { class: 'hint' });
    hint.appendChild(el('strong', {}, t.noAppHeading));
    hint.appendChild(el('p', {}, t.noAppBody));
    app.appendChild(hint);

    setTimeout(function () { location.href = scheme; }, 30);
  } else {
    document.title = t.notFoundHeading;
    app.appendChild(el('h1', {}, t.notFoundHeading));
    app.appendChild(el('p', { class: 'sub' }, t.notFoundBody));
    app.appendChild(el('p', {}, '<a class="home" href="/splitkz-legal/">' + t.homeLink + '</a>'));
  }
})();
</script>
</body>
</html>
